# The made-up shop of shop.compose.yaml, repaired. Each service names a database of its own (orders, payments and
# users share one database server, each with its own database; catalog has a server of its own), every service that
# others wait for has a healthcheck, and nothing waits longer than three steps. shop-fixed.override.yaml adds local
# settings on top, as a second file merged after this one.
name: shop

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
      catalog:
        condition: service_healthy
      users:
        condition: service_healthy
    environment:
      ORDERS_URL: http://orders:8080
      PAYMENTS_URL: http://payments:8080
      CATALOG_URL: http://catalog:8080
      USERS_URL: http://users:8080

  orders:
    build: ./orders
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orders:example@postgres:5432/orders
      PAYMENTS_URL: http://payments:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s

  payments:
    build: ./payments
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYMENTS_DB_HOST: postgres
      PAYMENTS_DB_NAME: payments
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s

  users:
    build: ./users
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://users:example@postgres:5432/users
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s

  catalog:
    build: ./catalog
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://catalog-db:27017/catalog
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  catalog-db:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
